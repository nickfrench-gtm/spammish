app = "spammish"
primary_region = "ord"
[build]
  dockerfile = "marketing/Dockerfile"
[env]
  PORT = "8080"
  WAITLIST_DATA_DIR = "/data/spammish"
  PUBLIC_ORIGIN = "https://spammish.fly.dev"
[[mounts]]
  source = "spammish_data"
  destination = "/data"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"
[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
